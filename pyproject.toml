[project]
name = "dungeon-agents"
version = "0.1.0"
description = "A console fantasy RPG for learning agentic AI patterns, en route to a QA/TestOps AI product."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # The [litellm] extra pulls in the adapter that lets the OpenAI Agents SDK
    # talk to Anthropic (Claude) and other providers.
    "openai-agents[litellm]>=0.18.0",
    # Pin: openai 2.37+ made `cache_write_tokens` a required field on
    # InputTokensDetails, but litellm 1.91.x still builds that object without it,
    # which raised a pydantic ValidationError on every model call through the
    # LiteLLM adapter. Capping openai at <2.37 keeps litellm and openai in sync.
    # Revisit when litellm ships support for the newer openai token schema.
    "openai>=2.36,<2.37",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
dungeon-agents = "dungeon_agents.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "llm: tests that require an OpenAI API key and make real model calls (deselect with '-m \"not llm\"')",
]
testpaths = ["tests"]
